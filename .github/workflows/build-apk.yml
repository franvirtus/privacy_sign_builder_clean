name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=APP_ADMIN_PASSWORD=${{ secrets.APP_ADMIN_PASSWORD }} \
            --dart-define=APP_MAIL_USERNAME=${{ secrets.APP_MAIL_USERNAME }} \
            --dart-define=APP_MAIL_PASSWORD=${{ secrets.APP_MAIL_PASSWORD }} \
            --dart-define=APP_MAIL_SENDER_NAME=${{ secrets.APP_MAIL_SENDER_NAME || 'Virtus Group s.r.l.' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virtus-privacy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
